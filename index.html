<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TrackDay Finder</title>
<meta name="theme-color" content="#0b6e8a">
<meta name="description" content="Trova le prove libere moto per circuito e organizzatore.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TrackDay Finder">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root {
  color-scheme: light dark;
  --bg: #edf0f3; --surface: #ffffff; --surface-2: #f5f7f9; --fg: #131d27; --muted: #556473; --line: #d3dae1;
  --accent: #0b6e8a; --accent-fg: #ffffff; --warn: #8a5a00; --bad: #a32035;
  --o-rf: #0b6e8a; --o-gully: #6b4fc0; --o-promo: #b45309; --o-rosso: #b3263e; --o-cremona: #2f7d32; --o-rehm: #1d4ed8; --o-speer: #be185d; --o-altro: #556473;
  --f-head: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e151b; --surface: #16202a; --surface-2: #1c2834; --fg: #e8edf2; --muted: #9aa9b8; --line: #2b3a48;
    --accent: #4cc0e0; --accent-fg: #07222b; --warn: #f0c36a; --bad: #f07a8e;
    --o-rf: #4cc0e0; --o-gully: #a994ee; --o-promo: #f0a24a; --o-rosso: #f07a8e; --o-cremona: #7fd283; --o-rehm: #7aa2ff; --o-speer: #f472b6; --o-altro: #9aa9b8;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-top: max(24px, env(safe-area-inset-top, 0px)); padding-bottom: max(48px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.top { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
h1 { font-family: var(--f-head); font-weight: 700; font-size: clamp(1.6rem, 4.5vw, 2.3rem); line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h2 { font-family: var(--f-head); font-weight: 700; font-size: 1.05rem; margin: 0; }
.sub { color: var(--muted); margin: 6px 0 0; font-size: 0.9rem; }
.label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; color: inherit; cursor: pointer; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; min-height: 34px; }
.chip .n { font-family: var(--f-mono); font-size: 0.78rem; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: 0.85; }
.chip.zero { border-style: dashed; color: var(--muted); }
.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.dd { position: relative; }
.dd-btn { width: 100%; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); border-radius: 8px; padding: 9px 12px; min-height: 42px; font-size: 0.92rem; text-align: left; cursor: pointer; }
.dd-btn[aria-expanded="true"] { border-color: var(--accent); }
.dd-btn.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.dd-v { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dd-btn svg { width: 16px; height: 16px; flex: none; color: var(--muted); transition: transform 0.15s; }
.dd-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
.dd-list { position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; right: 0; min-width: 220px; max-height: min(60vh, 360px); overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.18); padding: 4px; }
.dd-opt { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 6px; cursor: pointer; font-size: 0.92rem; }
.dd-opt:hover { background: var(--surface-2); }
.dd-opt input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); flex: none; }
.dd-opt .t { flex: 1; min-width: 0; }
.dd-opt .n, .dd-btn .n { font-family: var(--f-mono); font-size: 0.78rem; color: var(--muted); }
.dd-opt.zero .t { color: var(--muted); }
.dd-opt.all { border-bottom: 1px solid var(--line); border-radius: 6px 6px 0 0; margin-bottom: 2px; font-weight: 600; }
.dd-btn:focus-visible, .dd-opt input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip:focus-visible, .seg button:focus-visible, .nav button:focus-visible, .refresh:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--muted)); flex: none; }
.chip[aria-pressed="true"] .dot { box-shadow: 0 0 0 2px var(--accent-fg); }
.bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 7px 16px; min-height: 36px; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.count { color: var(--muted); font-size: 0.9rem; }
.refresh { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; min-height: 40px; font-weight: 600; display: inline-flex; gap: 8px; align-items: center; }
.bell { position: relative; width: 40px; min-height: 40px; padding: 0; justify-content: center; }
.refresh.bell svg { width: 20px; height: 20px; }
.refresh.bell { gap: 0; }
.bell .n { position: absolute; top: -7px; right: -7px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--bad); color: #fff; font: 600 0.72rem/20px var(--f-mono); text-align: center; border: 2px solid var(--bg); box-sizing: content-box; }
.bell.has { border-color: var(--bad); color: var(--bad); }
.bell.has svg { animation: ring 2.4s ease-in-out 1; transform-origin: 50% 10%; }
@keyframes ring { 0%, 55%, 100% { transform: rotate(0); } 10%, 30% { transform: rotate(14deg); } 20%, 40% { transform: rotate(-14deg); } }
.bellpanel { gap: 10px; }
.bellpanel h2 { margin: 0; font-size: 1.02rem; }
.bellpanel ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow-y: auto; }
.bellpanel li { display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding: 6px 0; font-size: 0.92rem; }
.bellpanel li .m { color: var(--muted); }
.bellpanel .hd { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.tag-new { font-family: var(--f-mono); font-size: 0.7rem; font-weight: 600; color: #fff; background: var(--bad); border-radius: 999px; padding: 1px 8px; }
.refresh[disabled] { opacity: 0.6; cursor: default; }
.refresh svg { width: 16px; height: 16px; }
.refresh.spin svg { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.status { font-size: 0.85rem; color: var(--muted); }
.status.err { color: var(--bad); }
.banner { border: 1px solid var(--warn); border-radius: 8px; padding: 10px 14px; font-size: 0.88rem; background: var(--surface); }
.empty { border: 1px dashed var(--line); border-radius: 8px; padding: 22px 16px; color: var(--muted); background: var(--surface); }
.month { display: flex; flex-direction: column; gap: 8px; }
.month > h2 { text-transform: capitalize; padding-bottom: 6px; border-bottom: 2px solid var(--fg); display: flex; justify-content: space-between; align-items: baseline; }
.month > h2 span { font-family: var(--f-body); font-weight: 400; font-size: 0.85rem; color: var(--muted); }
.row { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.date { font-family: var(--f-mono); line-height: 1.2; }
.date b { font-size: 1.15rem; display: block; font-weight: 500; }
.date small { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; }
.what { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.what strong { font-family: var(--f-head); font-size: 1.05rem; }
.what strong i { font-style: normal; font-family: var(--f-mono); font-size: 0.7rem; color: var(--muted); margin-left: 6px; font-weight: 500; }
.meta { color: var(--muted); font-size: 0.85rem; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.org { display: inline-flex; align-items: center; gap: 6px; color: var(--fg); font-weight: 500; }
.book { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.price { font-family: var(--f-mono); font-size: 0.82rem; color: var(--muted); }
.btn { display: inline-block; text-decoration: none; background: var(--accent); color: var(--accent-fg); border-radius: 6px; padding: 8px 14px; font-weight: 600; font-size: 0.88rem; }
.nav { display: flex; align-items: center; gap: 10px; }
.nav button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; width: 40px; height: 40px; font-size: 1.1rem; }
.nav button:disabled { opacity: 0.35; cursor: default; }
.nav h2 { text-transform: capitalize; min-width: 9ch; text-align: center; font-size: 1.15rem; }
.gridwrap { overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); width: 100%; }
.dow { padding: 8px; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--surface-2); }
.cell { min-height: 92px; padding: 6px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cell:nth-child(7n) { border-right: 0; }
.cell.out { background: var(--surface-2); }
.cell .d { font-family: var(--f-mono); font-size: 0.78rem; color: var(--muted); }
.cell.today .d { color: var(--accent); font-weight: 700; }
.pill { display: flex; align-items: center; gap: 5px; text-decoration: none; color: var(--fg); font-size: 0.74rem; line-height: 1.2; padding: 3px 5px; border-radius: 4px; background: color-mix(in srgb, var(--c) 16%, var(--surface)); min-width: 0; }
.pill span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.tw { overflow-x: auto; }
.st { font-family: var(--f-mono); font-size: 0.75rem; white-space: nowrap; }
.st.ok { color: var(--accent); } .st.vuoto { color: var(--muted); } .st.da_controllare, .st.errore { color: var(--warn); }
a { color: var(--accent); }
.install { font-size: 0.88rem; color: var(--muted); }
.install button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 12px; margin-right: 8px; }
.tabs { align-self: flex-start; }
.tabs button { padding: 8px 18px; font-weight: 600; }
.tabs a { padding: 8px 18px; font-weight: 600; text-decoration: none; color: var(--fg); background: var(--surface); display: inline-flex; align-items: center; min-height: 36px; }
@media (max-width: 560px) {
  .tabs { align-self: stretch; display: flex; flex-wrap: nowrap; }
  .tabs > button, .tabs > a { flex: 1 1 0; min-width: 0; justify-content: center; text-align: center; padding: 8px 6px; font-size: 0.88rem; line-height: 1.2; }
}
.pick { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 12px; min-height: 36px; font-size: 0.86rem; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.pick[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.pick.rm { color: var(--bad); }
.warn { color: var(--warn); font-weight: 500; }
.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.tools .tip { flex-basis: 100%; color: var(--muted); font-size: 0.85rem; }
.row.sel { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.book .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 560px) {
  .row { grid-template-columns: 78px minmax(0, 1fr); }
  .book { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; align-items: center; }
  .dow { padding: 6px 2px; font-size: 0.62rem; letter-spacing: 0.02em; text-align: center; }
  .cell { min-height: 64px; padding: 3px 2px; gap: 2px; }
  .cell .d { font-size: 0.7rem; padding-left: 2px; }
  .pill { gap: 0; padding: 2px 3px; font-size: 0.6rem; line-height: 1.15; border-left: 3px solid var(--c); border-radius: 3px; }
  .pill .dot { display: none; }
}
@media (max-width: 360px) {
  .pill { font-size: 0.55rem; padding: 2px; }
}
@media (prefers-reduced-motion: reduce) { .refresh.spin svg { animation: none; } .bell.has svg { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>TrackDay Finder</h1>
      <p class="sub" id="sub">Caricamento delle date…</p>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
      <div style="display:flex;gap:10px;align-items:center">
      <button class="refresh bell" id="bell" type="button" aria-expanded="false" aria-controls="bellPanel" aria-label="Nessuna nuova data">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
        <span class="n" id="bellN" hidden></span>
      </button>
      <button class="refresh" id="refresh" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
        Aggiorna
      </button>
      </div>
      <span class="status" id="status" aria-live="polite"></span>
    </div>
  </header>

  <section class="panel bellpanel" id="bellPanel" hidden aria-label="Nuove date"></section>

  <nav class="seg tabs" role="group" aria-label="Pagina">
    <button id="tab-all" type="button" aria-pressed="true">Tutte le date</button>
    <button id="tab-mio" type="button" aria-pressed="false">Il mio calendario</button>
    <a href="diario.html" id="tab-diario">Diario giornate</a>
  </nav>

  <div id="banner"></div>

  <section class="panel filters" id="filters" aria-label="Filtri">
    <div><div class="label" id="fn-l">Nazione</div><div class="dd" id="fn" data-key="countries"></div></div>
    <div><div class="label" id="fc-l">Circuito</div><div class="dd" id="fc" data-key="circuits"></div></div>
    <div><div class="label" id="fo-l">Organizzatore</div><div class="dd" id="fo" data-key="orgs"></div></div>
  </section>

  <div class="tools" id="mioTools" hidden>
    <button class="refresh" id="ics" type="button">Scarica nel calendario (.ics)</button>
    <button class="refresh" id="copy" type="button">Copia elenco</button>
    <button class="refresh" id="clear" type="button">Svuota</button>
    <span class="status" id="toolSt" aria-live="polite"></span>
    <div class="tip" id="tip"></div>
  </div>

  <div class="bar">
    <div class="count" id="count" aria-live="polite"></div>
    <div class="seg" role="group" aria-label="Vista">
      <button id="vl" type="button" aria-pressed="true">Lista</button>
      <button id="vm" type="button" aria-pressed="false">Mese</button>
    </div>
  </div>

  <main id="out"></main>

  <section class="panel" id="srcpanel" aria-label="Fonti">
    <h2>Fonti controllate</h2>
    <div class="tw"><table id="src"></table></div>
  </section>

  <p class="install" id="install"></p>
</div>

<script>
"use strict";
const MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const GIORNI = ["dom","lun","mar","mer","gio","ven","sab"];
const KNOWN_ORGS = ["rf", "gully", "promo", "rosso", "cremona", "rehm", "speer", "altro"];
const STATO = { ok: "ok", vuoto: "nessuna data", da_controllare: "da controllare", errore: "errore" };

let DATA = { events: [], circuits: [], orgs: {}, sources: [] };
const state = { countries: new Set(), circuits: new Set(), orgs: new Set(), view: "list", ym: null, open: null, page: "all" };
const NAZIONI = { IT: "Italia", ES: "Spagna", FR: "Francia", DE: "Germania", PT: "Portogallo", HR: "Croazia", CZ: "Rep. Ceca", NL: "Paesi Bassi", AT: "Austria", SI: "Slovenia", HU: "Ungheria", BE: "Belgio", GB: "Regno Unito", CH: "Svizzera", PL: "Polonia", SK: "Slovacchia" };
const flag = (cc) => /^[A-Z]{2}$/.test(cc) ? String.fromCodePoint(...[...cc].map((ch) => 0x1F1A5 + ch.charCodeAt(0))) : "";
const nationName = (cc) => NAZIONI[cc] || cc;
const $ = (id) => document.getElementById(id);
const parse = (s) => new Date(s + "T00:00:00");
const iso = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
const safeUrl = (u) => /^https?:\/\//i.test(u) ? u : "#";
const orgColor = (o) => "var(--o-" + (KNOWN_ORGS.includes(o) ? o : "altro") + ")";
const orgName = (o) => DATA.orgs[o] || o;
const circ = (id) => DATA.circuits.find((c) => c.id === id) || { id, name: id, country: "" };
const evCountry = (e) => e.country || circ(e.circuit).country || "";

// Le date scelte restano su questo dispositivo (localStorage). Si salva anche una copia
// dell'evento, per non perderlo se il sito dell'organizzatore lo toglie.
const MIO_KEY = "tdf.mio.v1";
let mio = {};
try { mio = JSON.parse(localStorage.getItem(MIO_KEY)) || {}; } catch (e) { mio = {}; }
const saveMio = () => { try { localStorage.setItem(MIO_KEY, JSON.stringify(mio)); } catch (e) {} };
function mioList() {
  const oggi = iso(new Date());
  return Object.values(mio).map((snap) => {
    const live = DATA.events.find((e) => e.id === snap.id);
    return live || Object.assign({}, snap, DATA.loaded ? { gone: true } : {});
  }).filter((e) => e.end >= oggi).sort((a, b) => a.start.localeCompare(b.start));
}
function toggleMio(id) {
  const e = DATA.events.find((x) => x.id === id);
  if (mio[id]) delete mio[id]; else if (e) mio[id] = e;
  saveMio(); render();
}
const overlaps = (list, e) => list.filter((o) => o.id !== e.id && o.start <= e.end && e.start <= o.end);

function filtered() {
  return DATA.events.filter((e) => (!state.countries.size || state.countries.has(evCountry(e))) && (!state.circuits.size || state.circuits.has(e.circuit)) && (!state.orgs.size || state.orgs.has(e.org)))
    .sort((a, b) => a.start.localeCompare(b.start));
}

const CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';

// Elenco a discesa con selezione multipla. items: { value, label, n, color }
function dropdown(el, key, allLabel, pluralLabel, items, totalN) {
  const sel = state[key], open = state.open === key, id = el.id;
  const chosen = items.filter((it) => sel.has(it.value));
  const summary = !sel.size ? allLabel : chosen.length <= 2 ? chosen.map((it) => it.label).join(", ") : chosen.length + " " + pluralLabel;
  const opt = (it) => '<label class="dd-opt' + (it.n === 0 ? " zero" : "") + '"' + (it.n === 0 ? ' title="Nessuna data pubblicata"' : "") + '><input type="checkbox" value="' + esc(it.value) + '"' + (sel.has(it.value) ? " checked" : "") + ">" +
    (it.color ? '<span class="dot" style="--c:' + it.color + '"></span>' : "") + '<span class="t">' + esc(it.label) + '</span><span class="n">' + it.n + "</span></label>";
  el.innerHTML = '<button type="button" class="dd-btn' + (sel.size ? " on" : "") + '" aria-haspopup="true" aria-expanded="' + open + '" aria-controls="' + id + '-list" aria-labelledby="' + id + "-l " + id + '-v">' +
    '<span class="dd-v" id="' + id + '-v">' + esc(summary) + "</span>" + CHEV + "</button>" +
    '<div class="dd-list" id="' + id + '-list" role="group" aria-labelledby="' + id + '-l"' + (open ? "" : " hidden") + ">" +
    '<label class="dd-opt all"><input type="checkbox" data-all' + (sel.size ? "" : " checked") + '><span class="t">' + esc(allLabel) + '</span><span class="n">' + totalN + "</span></label>" +
    items.map(opt).join("") + "</div>";
}

function renderFilters() {
  const ccs = [...new Set([...DATA.circuits.map((c) => c.country), ...DATA.events.map(evCountry)])].filter(Boolean)
    .sort((a, b) => nationName(a).localeCompare(nationName(b), "it"));
  dropdown($("fn"), "countries", "Tutte", "nazioni", ccs.map((cc) => ({
    value: cc, label: (flag(cc) ? flag(cc) + " " : "") + nationName(cc), n: DATA.events.filter((e) => evCountry(e) === cc).length,
  })), DATA.events.length);
  const shown = DATA.circuits.filter((c) => !state.countries.size || state.countries.has(c.country))
    .sort((x, y) => x.name.localeCompare(y.name, "it", { sensitivity: "base" }));
  dropdown($("fc"), "circuits", "Tutti", "circuiti", shown.map((c) => ({
    value: c.id, label: c.name + (c.country ? " · " + c.country : ""), n: DATA.events.filter((e) => e.circuit === c.id).length,
  })), DATA.events.filter((e) => !state.countries.size || state.countries.has(evCountry(e))).length);
  const orgs = [...new Set([...Object.keys(DATA.orgs), ...DATA.events.map((e) => e.org)])].filter((o) => o !== "altro" || DATA.events.some((e) => e.org === "altro"))
    .sort((x, y) => (x === "altro") - (y === "altro") || orgName(x).localeCompare(orgName(y), "it", { sensitivity: "base" }));
  dropdown($("fo"), "orgs", "Tutti", "organizzatori", orgs.map((o) => ({
    value: o, label: orgName(o), n: DATA.events.filter((e) => e.org === o).length, color: orgColor(o),
  })), DATA.events.length);
}

document.querySelector(".filters").addEventListener("click", (ev) => {
  const btn = ev.target.closest(".dd-btn");
  if (!btn) return;
  const key = btn.closest(".dd").dataset.key;
  state.open = state.open === key ? null : key;
  renderFilters();
  document.querySelector('.dd[data-key="' + key + '"] .dd-btn').focus();
});
document.querySelector(".filters").addEventListener("change", (ev) => {
  const input = ev.target, dd = input.closest(".dd");
  if (!dd) return;
  const key = dd.dataset.key, sel = state[key];
  if (input.hasAttribute("data-all")) sel.clear();
  else input.checked ? sel.add(input.value) : sel.delete(input.value);
  // Tieni scelti solo i circuiti delle nazioni ancora selezionate
  if (key === "countries" && state.countries.size) [...state.circuits].forEach((id) => { if (!state.countries.has(circ(id).country)) state.circuits.delete(id); });
  const scroll = dd.querySelector(".dd-list").scrollTop;
  render();
  const list = document.querySelector('.dd[data-key="' + key + '"] .dd-list');
  list.scrollTop = scroll;
  const again = input.hasAttribute("data-all") ? list.querySelector("[data-all]") : list.querySelector('input[value="' + CSS.escape(input.value) + '"]');
  if (again) again.focus({ preventScroll: true });
});
document.addEventListener("click", (ev) => {
  // Un elemento staccato dal documento viene da un elenco appena ridisegnato: non è un clic fuori
  if (state.open && ev.target.isConnected && !ev.target.closest(".dd")) { state.open = null; renderFilters(); }
});
document.addEventListener("keydown", (ev) => {
  if (ev.key !== "Escape" || !state.open) return;
  const key = state.open; state.open = null; renderFilters();
  document.querySelector('.dd[data-key="' + key + '"] .dd-btn').focus();
});

// Campanella: segnala le date comparse dall'ultima volta che l'elenco e' stato visto.
// Si ricorda, su questo dispositivo, l'elenco di date gia' viste; si aggiorna alla chiusura del pannello.
const SEEN_KEY = "tdf.seen.v1";
let seen = null, newIds = new Set();
try { seen = JSON.parse(localStorage.getItem(SEEN_KEY)); } catch (e) { seen = null; }
const saveSeen = () => { try { localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); } catch (e) {} };
const rangeText = (e) => e.start === e.end ? fmtChecked(e.start) : fmtChecked(e.start) + " – " + fmtChecked(e.end);
function newOnes() {
  if (!seen) return [];
  const had = new Set(seen.ids);
  return DATA.events.filter((e) => !had.has(e.id)).sort((a, b) => a.start.localeCompare(b.start));
}
function updateBell() {
  if (!DATA.loaded) return;
  if (!seen) { seen = { ids: DATA.events.map((e) => e.id), at: DATA.checked }; saveSeen(); }   // prima visita: nessuna novita'
  const list = newOnes();
  newIds = new Set(list.map((e) => e.id));
  const n = list.length, b = $("bell");
  b.classList.toggle("has", n > 0);
  $("bellN").hidden = !n; $("bellN").textContent = n > 99 ? "99+" : String(n);
  b.setAttribute("aria-label", n ? n + (n === 1 ? " nuova data" : " nuove date") + " dall'ultima sync visualizzata" : "Nessuna nuova data");
  if (!$("bellPanel").hidden) renderBellPanel(list);
}
function renderBellPanel(list) {
  const since = seen && seen.at ? " (controllo del " + fmtChecked(seen.at) + ")" : "";
  $("bellPanel").innerHTML = '<div class="hd"><h2>' + (list.length ? list.length + (list.length === 1 ? " nuova data" : " nuove date") : "Nessuna nuova data") +
    '</h2><button class="refresh" id="bellClose" type="button">Segna come viste</button></div>' +
    '<div class="muted" style="font-size:0.85rem">Rispetto all\'ultima sync che avevi visualizzato' + esc(since) + ".</div>" +
    (list.length ? "<ul>" + list.map((e) => "<li><span><strong>" + esc(rangeText(e)) + '</strong> · ' + esc(circ(e.circuit).name) + '</span><span class="m">' + esc(orgName(e.org)) + (e.price ? " · " + esc(e.price) : "") + "</span></li>").join("") + "</ul>"
      : '<div class="muted">Da quando hai guardato l\'ultima volta nessun organizzatore ha aggiunto date.</div>');
}
function markSeen() {
  seen = { ids: DATA.events.map((e) => e.id), at: DATA.checked }; saveSeen();
  newIds = new Set();
  $("bellPanel").hidden = true; $("bell").setAttribute("aria-expanded", "false");
  updateBell(); render();
}
function toggleBell() {
  const open = $("bellPanel").hidden;
  if (!open) { markSeen(); return; }                    // chiudere = aver visto
  $("bellPanel").hidden = false; $("bell").setAttribute("aria-expanded", "true");
  renderBellPanel(newOnes());
}

function dateBlock(e) {
  const a = parse(e.start), b = parse(e.end), same = e.start === e.end;
  const main = same ? a.getDate() : a.getDate() + "–" + b.getDate() + (a.getMonth() !== b.getMonth() ? " " + MESI[b.getMonth()].slice(0, 3) : "");
  const small = same ? GIORNI[a.getDay()] : GIORNI[a.getDay()] + "–" + GIORNI[b.getDay()];
  return '<div class="date"><b>' + esc(main) + "</b><small>" + small + "</small></div>";
}

function emptyMsg() {
  if (state.page === "mio") return '<div class="empty">Non hai ancora scelto nessuna data. Vai su «Tutte le date» e tocca «Aggiungi» sulle date che ti interessano: qui comporrai il tuo calendario.</div>';
  const names = [...state.circuits].map((id) => circ(id).name);
  let m = "Nessuna data con questi filtri.";
  if (!names.length && state.countries.size) names.push(...[...state.countries].map(nationName));
  if (names.length) m = "Nessuna data pubblicata per " + names.join(", ") + (state.orgs.size ? " con gli organizzatori scelti" : "") + ". Gli organizzatori non ne hanno ancora caricate.";
  return '<div class="empty">' + esc(m) + "</div>";
}

function renderList(list) {
  if (!list.length) return emptyMsg();
  const isMio = state.page === "mio";
  const groups = new Map();
  list.forEach((e) => { const k = e.start.slice(0, 7); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(e); });
  let h = "";
  groups.forEach((items, k) => {
    const [y, m] = k.split("-").map(Number);
    h += '<section class="month"><h2>' + MESI[m - 1] + " " + y + "<span>" + items.length + (items.length === 1 ? " data" : " date") + "</span></h2>";
    items.forEach((e) => {
      const c = circ(e.circuit);
      const ov = isMio ? overlaps(list, e) : [];
      const pick = isMio
        ? '<button class="pick rm" type="button" data-toggle="' + esc(e.id) + '">Rimuovi</button>'
        : '<button class="pick" type="button" data-toggle="' + esc(e.id) + '" aria-pressed="' + (mio[e.id] ? "true" : "false") + '">' + (mio[e.id] ? "★ Nel mio calendario" : "☆ Aggiungi") + "</button>";
      h += '<article class="row' + (!isMio && mio[e.id] ? " sel" : "") + '">' + dateBlock(e) +
        '<div class="what"><strong>' + esc(c.name) + (c.country ? "<i>" + esc(c.country) + "</i>" : "") + "</strong>" +
        '<div class="meta"><span class="org"><span class="dot" style="--c:' + orgColor(e.org) + '"></span>' + esc(orgName(e.org)) + "</span>" +
        (e.note ? "<span>" + esc(e.note) + "</span>" : "") +
        (!isMio && newIds.has(e.id) ? '<span class="tag-new">Nuova</span>' : "") +
        (e.gone ? '<span class="warn">Non più sul sito dell\'organizzatore: controlla</span>' : "") +
        (ov.length ? '<span class="warn">Si sovrappone a ' + ov.map((o) => esc(circ(o.circuit).name)).join(", ") + "</span>" : "") + "</div></div>" +
        '<div class="book"><span class="price">' + esc(e.price || "Prezzo sul sito") + '</span><div class="acts">' + pick +
        '<a class="btn" href="' + esc(safeUrl(e.url)) + '" target="_blank" rel="noopener">Dettagli</a></div></div></article>';
    });
    h += "</section>";
  });
  return h;
}

function curKey() { return state.ym.y + "-" + String(state.ym.m + 1).padStart(2, "0"); }

function renderMonth(list) {
  if (!state.ym) {
    const base = list[0] ? parse(list[0].start) : new Date();
    state.ym = { y: base.getFullYear(), m: base.getMonth() };
  }
  const { y, m } = state.ym;
  const offset = (new Date(y, m, 1).getDay() + 6) % 7;
  const days = new Date(y, m + 1, 0).getDate();
  const todayIso = iso(new Date());
  let cells = "";
  ["lun","mar","mer","gio","ven","sab","dom"].forEach((d) => { cells += '<div class="dow">' + d + "</div>"; });
  const total = Math.ceil((offset + days) / 7) * 7;
  for (let i = 0; i < total; i++) {
    const d = new Date(y, m, 1 - offset + i), di = iso(d);
    const evs = list.filter((e) => e.start <= di && di <= e.end);
    cells += '<div class="cell' + (d.getMonth() !== m ? " out" : "") + (di === todayIso ? " today" : "") + '"><span class="d">' + d.getDate() + "</span>" +
      evs.map((e) => '<a class="pill" style="--c:' + orgColor(e.org) + '" href="' + esc(safeUrl(e.url)) + '" target="_blank" rel="noopener" title="' +
        esc(circ(e.circuit).name + " · " + orgName(e.org)) + '"><span class="dot" style="--c:' + orgColor(e.org) + '"></span><span>' + esc(circ(e.circuit).name) + "</span></a>").join("") + "</div>";
  }
  const months = [...new Set(list.flatMap((e) => [e.start.slice(0, 7), e.end.slice(0, 7)]))].sort();
  const cur = curKey();
  const inMonth = months.includes(cur);
  return '<div class="nav"><button id="pm" type="button" aria-label="Mese precedente"' + (months.some((x) => x < cur) ? "" : " disabled") + '>‹</button><h2>' + MESI[m] + " " + y +
    '</h2><button id="nm" type="button" aria-label="Mese successivo"' + (months.some((x) => x > cur) ? "" : " disabled") + ">›</button></div>" +
    '<div class="gridwrap"><div class="grid">' + cells + "</div></div>" +
    (list.length ? (inMonth ? "" : '<div class="empty">Nessuna data in questo mese. Usa le frecce per vedere i mesi con eventi.</div>') : emptyMsg());
}

function jump(dir, list) {
  const cur = curKey();
  const months = [...new Set(list.flatMap((e) => [e.start.slice(0, 7), e.end.slice(0, 7)]))].sort();
  const t = dir > 0 ? months.find((x) => x > cur) : [...months].reverse().find((x) => x < cur);
  if (t) { const [y, m] = t.split("-").map(Number); state.ym = { y, m: m - 1 }; }
}

function renderSources() {
  const rows = (DATA.sources || []).map((s) =>
    "<tr><td><a href=\"" + esc(safeUrl(s.url)) + '" target="_blank" rel="noopener">' + esc(s.name) + "</a></td><td>" +
    esc(s.message || (s.status === "ok" ? "Letto correttamente." : "")) + '</td><td class="st ' + esc(s.status) + '">' +
    esc(STATO[s.status] || s.status) + " · " + s.count + "</td></tr>").join("");
  $("src").innerHTML = "<thead><tr><th>Fonte</th><th>Esito</th><th>Date</th></tr></thead><tbody>" + rows + "</tbody>";
  const bad = (DATA.sources || []).filter((s) => s.status === "errore" || s.status === "da_controllare");
  $("banner").innerHTML = bad.length ? '<div class="banner">Da controllare: ' + bad.map((s) => esc(s.name)).join(", ") + ". Le date di queste fonti potrebbero non essere aggiornate.</div>" : "";
}

function render() {
  const isMio = state.page === "mio";
  const list = isMio ? mioList() : filtered();
  const nMio = Object.keys(mio).length;
  $("tab-all").setAttribute("aria-pressed", String(!isMio));
  $("tab-mio").setAttribute("aria-pressed", String(isMio));
  $("tab-mio").setAttribute("title", nMio ? nMio + (nMio === 1 ? " data scelta" : " date scelte") : "");
  $("filters").hidden = isMio; $("srcpanel").hidden = isMio; $("mioTools").hidden = !isMio || !list.length;
  if (isMio) renderTools(list); else renderFilters();
  $("count").textContent = isMio ? list.length + (list.length === 1 ? " data scelta" : " date scelte")
    : list.length + (list.length === 1 ? " data" : " date") + " mostrate su " + DATA.events.length;
  $("vl").setAttribute("aria-pressed", String(state.view === "list"));
  $("vm").setAttribute("aria-pressed", String(state.view === "month"));
  if (state.view === "list") { $("out").innerHTML = renderList(list); return; }
  if (state.ym && list.length && !list.some((e) => e.start.slice(0, 7) <= curKey() && e.end.slice(0, 7) >= curKey()) && !state.keep) state.ym = null;
  $("out").innerHTML = renderMonth(list);
  const p = $("pm"), n = $("nm");
  if (p) p.addEventListener("click", () => { jump(-1, list); state.keep = true; render(); state.keep = false; });
  if (n) n.addEventListener("click", () => { jump(1, list); state.keep = true; render(); state.keep = false; });
}

function renderTools(list) {
  const nums = list.map((e) => (e.price || "").match(/(\d[\d.]*)/)).filter(Boolean).map((m) => parseInt(m[1].replace(/\./g, ""), 10));
  $("tip").textContent = nums.length
    ? "Prezzi di partenza dei turni scelti: circa " + nums.reduce((a, b) => a + b, 0).toLocaleString("it-IT") + " € in totale (" + nums.length + " su " + list.length + " con prezzo). Servizi e box esclusi. Il calendario è salvato su questo dispositivo."
    : "Il calendario è salvato su questo dispositivo.";
}

const ymd = (s) => s.replace(/-/g, "");
const icsEsc = (t) => String(t == null ? "" : t).replace(/\\/g, "\\\\").replace(/;/g, "\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
const titleOf = (e) => "Prove libere " + circ(e.circuit).name + " (" + orgName(e.org) + ")";
function buildIcs(list) {
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//TrackDay Finder//IT", "CALSCALE:GREGORIAN", "X-WR-CALNAME:TrackDay Finder"];
  list.forEach((e) => {
    const c = circ(e.circuit), nx = new Date(parse(e.end).getTime() + 90000000); // fine esclusa: giorno dopo
    lines.push("BEGIN:VEVENT", "UID:" + e.id + "@trackdayfinder", "DTSTAMP:" + stamp,
      "DTSTART;VALUE=DATE:" + ymd(e.start), "DTEND;VALUE=DATE:" + ymd(iso(nx)),
      "SUMMARY:" + icsEsc(titleOf(e)), "LOCATION:" + icsEsc(c.name + (c.country ? ", " + c.country : "")),
      "DESCRIPTION:" + icsEsc([e.price, e.note, e.url].filter(Boolean).join("\n")), e.url ? "URL:" + e.url : "", "END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  return lines.filter(Boolean).join("\r\n") + "\r\n";
}
function plainText(list) {
  return list.map((e) => {
    const d = e.start === e.end ? fmtChecked(e.start) : fmtChecked(e.start) + " – " + fmtChecked(e.end);
    return d + " · " + circ(e.circuit).name + " · " + orgName(e.org) + (e.price ? " · " + e.price : "") + (e.url ? "\n" + e.url : "");
  }).join("\n\n");
}
const say = (t) => { $("toolSt").textContent = t; setTimeout(() => { $("toolSt").textContent = ""; }, 4500); };
async function exportIcs() {
  const list = mioList();
  if (!list.length) return;
  const blob = new Blob([buildIcs(list)], { type: "text/calendar" });
  try {
    const file = new File([blob], "trackday-finder.ics", { type: "text/calendar" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "TrackDay Finder" }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "trackday-finder.ics";
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  say("File scaricato: aprilo per aggiungere le date al calendario.");
}
async function copyList() {
  try { await navigator.clipboard.writeText(plainText(mioList())); say("Elenco copiato."); }
  catch (e) { say("Copia non riuscita su questo dispositivo."); }
}
function route() {
  state.page = location.hash === "#mio" ? "mio" : "all";
  state.ym = null;
  render();
}

function fmtChecked(s) {
  if (!s) return "";
  const d = parse(s);
  return d.getDate() + " " + MESI[d.getMonth()] + " " + d.getFullYear();
}

async function load(manual) {
  const btn = $("refresh"), st = $("status");
  btn.disabled = true; btn.classList.add("spin"); st.className = "status"; st.textContent = manual ? "Aggiorno…" : "";
  try {
    const res = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const before = DATA.checked, n0 = DATA.events.length;
    DATA = await res.json();
    DATA.loaded = true;
    const oggi = iso(new Date());
    DATA.events = DATA.events.filter((e) => e.end >= oggi); // le date passate spariscono subito, anche tra un aggiornamento e l'altro
    $("sub").textContent = "Date di Racing Factory, Gully Racing, Promo Racing, Rosso Corsa, Rehm, Speer Racing e dei circuiti. Controllate il " + fmtChecked(DATA.checked) + ".";
    Object.keys(mio).forEach((k) => { if (mio[k].end < oggi) delete mio[k]; });
    saveMio();
    updateBell();
    renderSources(); render();
    if (manual) st.textContent = before === DATA.checked && n0 === DATA.events.length ? "Già aggiornato" : "Aggiornato";
  } catch (err) {
    st.className = "status err";
    st.textContent = "Impossibile aggiornare. Controlla la connessione.";
    if (!DATA.events.length) $("sub").textContent = "Date non disponibili.";
  } finally {
    btn.disabled = false; btn.classList.remove("spin");
  }
}

$("bell").addEventListener("click", toggleBell);
$("bellPanel").addEventListener("click", (ev) => { if (ev.target.closest("#bellClose")) markSeen(); });
$("tab-all").addEventListener("click", () => { location.hash = "tutte"; });
$("tab-mio").addEventListener("click", () => { location.hash = "mio"; });
window.addEventListener("hashchange", route);
$("out").addEventListener("click", (ev) => { const b = ev.target.closest("[data-toggle]"); if (b) toggleMio(b.dataset.toggle); });
$("ics").addEventListener("click", exportIcs);
$("copy").addEventListener("click", copyList);
$("clear").addEventListener("click", () => {
  const b = $("clear");
  if (b.dataset.sure) { mio = {}; saveMio(); delete b.dataset.sure; b.textContent = "Svuota"; render(); return; }
  b.dataset.sure = "1"; b.textContent = "Tocca ancora per svuotare";
  setTimeout(() => { delete b.dataset.sure; b.textContent = "Svuota"; }, 3500);
});
$("vl").addEventListener("click", () => { state.view = "list"; render(); });
$("vm").addEventListener("click", () => { state.view = "month"; render(); });
$("refresh").addEventListener("click", () => load(true));
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(false); });
route();
load(false);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

// Suggerimento di installazione
(function () {
  const box = $("install");
  const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if (standalone) return;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  let deferred = null;
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault(); deferred = e;
    box.innerHTML = '<button type="button" id="inst">Installa l\'app</button>Si apre come un\'app, anche senza barra del browser.';
    $("inst").addEventListener("click", async () => { deferred.prompt(); await deferred.userChoice; deferred = null; box.textContent = ""; });
  });
  if (ios) box.textContent = "Per installare l'app: tocca Condividi in Safari, poi «Aggiungi alla schermata Home».";
})();
</script>
