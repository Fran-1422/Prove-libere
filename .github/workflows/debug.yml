name: Debug fetch
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          mkdir -p dbg
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          curl -sL -A "$UA" https://www.pistard-racing.it/prove-libere-moto/ -o dbg/p_plm.html || true
          curl -sL -A "$UA" https://www.pistard-racing.it/vallelunga/ -o dbg/p_vall.html || true
          curl -sL -A "$UA" https://www.pistard-racing.it/vallelunga/prove-libere-open-pit-4-ore/77/ -o dbg/p_77.html || true
          curl -sL -A "$UA" https://motorsport.vallelunga.it/pl-moto-2/ -o dbg/v_pl.html || true
          curl -sL -A "$UA" https://motorsport.vallelunga.it/shop/ -o dbg/v_shop.html || true
          ls -la dbg
      - name: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dbg && git commit -qm "debug html" && git push
